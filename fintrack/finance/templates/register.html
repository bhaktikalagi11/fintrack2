{% extends 'base.html' %}

{% block title %}Create account | FinTrack{% endblock %}

{% block content %}
    <section class="panel form-panel">
        <h1 class="page-heading">Create your account</h1>
        <p class="intro">We'll set you up with starter categories and a cash account.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create account</button>
        </form>
        <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
    </section>
{% endblock %}
